<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <style>
    body { font-family: Arial; background: #4f46e5; display: flex; justify-content: center; padding: 40px; }
    .caixa { background: white; padding: 20px; border-radius: 12px; width: 360px; }
    h1, h2 { color: #1e3a5f; }
    label { display: block; margin-top: 10px; }
    input, select, button { width: 100%; padding: 8px; margin-top: 4px; font-size: 16px; }
    button { background: #4f46e5; color: white; border: none; cursor: pointer; margin-top: 10px; }
    .resultado { margin-top: 8px; font-weight: bold; background: #eef2ff; padding: 8px; }
  </style>
</head>
<body>
  <div class="caixa">
    <h1>Calculadora</h1>

    <h2>Conta básica</h2>
    <label>Primeiro número</label>
    <input type="number" id="num1">
    <label>Segundo número</label>
    <input type="number" id="num2">
    <label>Operação</label>
    <select id="operacao">
      <option value="+">Somar</option>
      <option value="-">Subtrair</option>
      <option value="*">Multiplicar</option>
      <option value="/">Dividir</option>
    </select>
    <button id="btn-basica">Calcular básica</button>
    <p class="resultado" id="resultado-basica">Resultado: —</p>

    <h2>Porcentagem</h2>
    <label>Valor</label>
    <input type="number" id="valor">
    <label>Porcentagem</label>
    <input type="number" id="percentual">
    <button id="btn-porcentagem">Calcular porcentagem</button>
    <p class="resultado" id="resultado-porcentagem">Resultado: —</p>
  </div>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora simples</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(160deg, #1e3a5f, #4f46e5);
      color: #1f2937;
    }

    .caixa {
      width: min(420px, 92vw);
      background: #ffffff;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin: 0 0 18px;
      text-align: center;
      color: #1e3a5f;
    }

    h2 {
      margin: 18px 0 10px;
      font-size: 16px;
      color: #4f46e5;
    }

    label {
      display: block;
      margin: 10px 0 6px;
      font-size: 14px;
      color: #374151;
    }

    input, select, button {
      width: 100%;
      border-radius: 10px;
      font-size: 16px;
    }

    input, select {
      border: 1px solid #d1d5db;
      padding: 12px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #4f46e5;
    }

    button {
      margin-top: 12px;
      border: none;
      padding: 12px;
      background: #4f46e5;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #3730a3;
    }

    .resultado {
      margin: 12px 0 0;
      padding: 10px 12px;
      border-radius: 10px;
      background: #eef2ff;
      color: #1e3a5f;
      font-weight: 600;
    }

    .linha {
      height: 1px;
      margin: 20px 0 4px;
      background: #e5e7eb;
    }
  </style>
</head>
<body>
  <main class="caixa">
    <h1>Calculadora</h1>

    <h2>Conta básica</h2>
    <label for="num1">Primeiro número</label>
    <input type="number" id="num1" placeholder="Ex: 10">

    <label for="num2">Segundo número</label>
    <input type="number" id="num2" placeholder="Ex: 5">

    <label for="operacao">Operação</label>
    <select id="operacao">
      <option value="+">Somar</option>
      <option value="-">Subtrair</option>
      <option value="*">Multiplicar</option>
      <option value="/">Dividir</option>
    </select>

    <button type="button" id="btn-basica">Calcular básica</button>
    <p class="resultado" id="resultado-basica">Resultado: —</p>

    <div class="linha"></div>

    <h2>Porcentagem</h2>
    <label for="valor">Valor</label>
    <input type="number" id="valor" placeholder="Ex: 200">

    <label for="percentual">Porcentagem</label>
    <input type="number" id="percentual" placeholder="Ex: 15">

    <button type="button" id="btn-porcentagem">Calcular porcentagem</button>
    <p class="resultado" id="resultado-porcentagem">Resultado: —</p>
  </main>

  <script>
    const num1 = document.getElementById("num1");
    const num2 = document.getElementById("num2");
    const operacao = document.getElementById("operacao");
    const btnBasica = document.getElementById("btn-basica");
    const resultadoBasica = document.getElementById("resultado-basica");

    const valor = document.getElementById("valor");
    const percentual = document.getElementById("percentual");
    const btnPorcentagem = document.getElementById("btn-porcentagem");
    const resultadoPorcentagem = document.getElementById("resultado-porcentagem");

    btnBasica.addEventListener("click", function () {
      if (num1.value === "" || num2.value === "") {
        resultadoBasica.textContent = "Preencha os dois números.";
        return;
      }

      const a = Number(num1.value);
      const b = Number(num2.value);
      const op = operacao.value;
      let resultado;

      if (op === "+") {
        resultado = a + b;
      } else if (op === "-") {
        resultado = a - b;
      } else if (op === "*") {
        resultado = a * b;
      } else if (op === "/") {
        if (b === 0) {
          resultadoBasica.textContent = "Não dá para dividir por zero.";
          return;
        }
        resultado = a / b;
      }

      resultadoBasica.textContent = "Resultado: " + resultado;
    });

    btnPorcentagem.addEventListener("click", function () {
      if (valor.value === "" || percentual.value === "") {
        resultadoPorcentagem.textContent = "Preencha o valor e a porcentagem.";
        return;
      }

      const total = Number(valor.value);
      const pct = Number(percentual.value);
      const resultado = (total * pct) / 100;

      resultadoPorcentagem.textContent = "Resultado: " + resultado;
    });
  </script>
</body>
</html>
